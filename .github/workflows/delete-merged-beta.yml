name: Delete merged beta branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-merged-beta.yml"

permissions:
  contents: write

jobs:
  delete-merged-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged beta/1.0.2 safely
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="beta/1.0.2"
          EXPECTED="a72644869d1d63d1336dc5fab50f6958dca475ed"
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')"
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "Ref has changed. Refusing to delete $BRANCH"
            exit 1
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
          echo "Deleted $BRANCH. The beta release tag is preserved."
