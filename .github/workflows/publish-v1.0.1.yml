name: Publish Auto Type v1.0.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.0.1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source editions
        run: |
          set -euo pipefail
          for edition in iframe hybrid; do
            test "$(node -p "require('./${edition}/manifest.json').version")" = "1.0.1"
            for script in background.js content.js main-bridge.js popup.js; do
              node --check "$edition/$script"
            done
          done
      - name: Package iframe and Hybrid extensions
        run: |
          set -euo pipefail
          for edition in iframe hybrid; do
            (cd "$edition" && zip -q -r "$GITHUB_WORKSPACE/auto-type-1.0.1-${edition}.zip" LICENSE README.md background.js content.js main-bridge.js manifest.json popup.css popup.html popup.js icons/)
            unzip -l "auto-type-1.0.1-${edition}.zip" | grep -q " manifest.json"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## What’s changed

          - **Input recovery:** Text entered in the popup is kept per Google Docs tab for the current browser session, so reopening the extension after a failed or interrupted run does not require pasting it again.
          - **More resilient iframe startup:** Transient unavailability of the Google Docs input target is retried before typing begins.
          - **Safer repeated runs:** A new session cannot start before the previous session has finished cleanup.
          - **Better diagnostics:** Errors now include the current stage and non-content iframe status in DevTools logs; the extension does not log the submitted text.
          - Updated both the **iframe** and **Hybrid** editions to **1.0.1**.

          ## Downloads

          - `auto-type-1.0.1-iframe.zip` — recommended for most users; no Chrome debugger permission.
          - `auto-type-1.0.1-hybrid.zip` — can fall back to Chrome DevTools Protocol (CDP); requires debugger permission.

          Extract one archive and use **Load unpacked** in `chrome://extensions`, selecting the folder containing `manifest.json`.

          ## Known issue

          Google Docs uses an undocumented iframe-based input interface; synthetic keyboard events can occasionally be ignored, particularly during background typing. The previously reported intermittent repeat-run failure is not currently reproducible, so the root cause has not been confirmed. Verify the resulting document after each run.
          NOTES
          if gh release view 1.0.1 >/dev/null 2>&1; then
            gh release upload 1.0.1 auto-type-1.0.1-iframe.zip auto-type-1.0.1-hybrid.zip --clobber
            gh release edit 1.0.1 --title "Auto Type v1.0.1" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --prerelease=false
          else
            gh release create 1.0.1 auto-type-1.0.1-iframe.zip auto-type-1.0.1-hybrid.zip --title "Auto Type v1.0.1" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA" --draft=false --prerelease=false
          fi
