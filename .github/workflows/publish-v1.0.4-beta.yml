name: Build and publish v1.0.4-beta

on:
  push:
    branches:
      - dev/1.0.4
      - main
    paths:
      - 'iframe/**'
      - 'hybrid/**'
      - 'tests/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate beta metadata and scripts
        shell: bash
        run: |
          set -euo pipefail
          for edition in iframe hybrid; do
            node -e "const m=require('./${edition}/manifest.json');if(m.version!=='1.0.4' || m.version_name!=='1.0.4-beta')process.exit(1)"
            for file in background.js content.js main-bridge.js config-codec.js popup.js; do
              node --check "$edition/$file"
            done
          done
          node --test tests/*.cjs
      - name: Package two standalone Chrome extension ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for edition in iframe hybrid; do
            output="../dist/auto-type-1.0.4-beta-${edition}.zip"
            (cd "$edition" && zip -q -r "$output" \
              LICENSE README.md manifest.json background.js content.js \
              main-bridge.js config-codec.js popup.html popup.css popup.js icons/)
            archive="dist/auto-type-1.0.4-beta-${edition}.zip"
            unzip -t "$archive" | tail -1
            for required in manifest.json config-codec.js background.js popup.html popup.js icons/icon16.png icons/icon48.png; do
              unzip -Z1 "$archive" | grep -Fxq "$required"
            done
            unzip -p "$archive" config-codec.js | cmp - "$edition/config-codec.js"
            unzip -p "$archive" popup.html | cmp - "$edition/popup.html"
            unzip -p "$archive" manifest.json | cmp - "$edition/manifest.json"
          done
          sha256sum dist/*.zip
      - name: Create beta release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.4-beta"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release already exists for $tag; refusing to overwrite it."
            exit 1
          fi
          cat > /tmp/beta-notes.md <<'EOF'
          ## Auto Type v1.0.4-beta

          **Pre-release for testing.** Stable v1.0.3 remains available as the latest stable release.

          ### Changes
          - Fix the popup's upper-left `at.` badge: the dot is now aligned inside the icon.
          - Share or restore all 30 typing settings with a compact, versioned `AT1.` token.
          - Import or export validated JSON settings; download or open local `.json` backups.
          - Register an optional feedback page opened by Chrome upon uninstall (submission is voluntary).
          - Retain the v1.0.3 editor-protection and draft-saving fixes.

          ### Downloads
          - `auto-type-1.0.4-beta-iframe.zip` — recommended; no debugger permission.
          - `auto-type-1.0.4-beta-hybrid.zip` — Chrome debugger permission for CDP fallback.

          Unzip the chosen archive, then load its folder with `chrome://extensions` → Developer mode → Load unpacked.

          **Caution:** Google Docs uses undocumented editor internals; confirm the final document.
          No Chrome Web Store update is included. Feedback page hosting is configured separately via GitHub Pages.
          EOF
          gh release create "$tag" \
            dist/auto-type-1.0.4-beta-iframe.zip \
            dist/auto-type-1.0.4-beta-hybrid.zip \
            --title "Auto Type v1.0.4-beta" \
            --target "$GITHUB_SHA" \
            --prerelease --latest=false --notes-file /tmp/beta-notes.md
      - name: Verify published beta and retire development branch
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.4-beta"
          gh release view "$tag" --json tagName,isPrerelease,isDraft,assets \
            | jq -e '.tagName=="v1.0.4-beta" and .isPrerelease==true and .isDraft==false and ([.assets[].name] | sort)==(["auto-type-1.0.4-beta-hybrid.zip","auto-type-1.0.4-beta-iframe.zip"] | sort)'
          mkdir -p dist/verify
          gh release download "$tag" --dir dist/verify --pattern 'auto-type-1.0.4-beta-*.zip'
          for edition in iframe hybrid; do
            filename="auto-type-1.0.4-beta-${edition}.zip"
            cmp "dist/$filename" "dist/verify/$filename"
          done
          sha256sum dist/verify/*.zip
          # Deleting the branch happens only after a verified beta release.
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/dev/1.0.4"
