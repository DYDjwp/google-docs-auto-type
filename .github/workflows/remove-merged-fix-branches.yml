name: Remove merged P1 fix branches (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-merged-fix-branches.yml'

permissions:
  contents: write

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged commits and safely delete both refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "fix/queued-cdp-iframe:5c2cddb0858ebc3711f12ee61d051c9cfdd43aec"
            "fix/cdp-backspace-frame-navigation:c158a78af3fe2924afe5fc263ad92dc6d3f7fdd2"
          )
          for entry in "${branches[@]}"; do
            branch="${entry%%:*}"
            sha="${entry#*:}"
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$current" != "$sha" ]; then
              echo "::error::Ref $branch moved from expected $sha to $current; refusing deletion"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then
              echo "::error::$branch is not merged into main; refusing deletion"
              exit 1
            fi
          done
          for entry in "${branches[@]}"; do
            branch="${entry%%:*}"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted merged branch: $branch"
          done
          for entry in "${branches[@]}"; do
            branch="${entry%%:*}"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "::error::Branch still exists: $branch"
              exit 1
            fi
          done
