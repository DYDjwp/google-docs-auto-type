name: Publish stable Auto Type v1.0.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-stable-v1.0.2.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audited stable source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate extension code and run regression suite
        run: |
          set -euo pipefail
          for edition in iframe hybrid; do
            node -e "const m = require('./${edition}/manifest.json'); if (m.version !== '1.0.2' || m.version_name !== '1.0.2') process.exit(1)"
            for script in background.js content.js main-bridge.js popup.js; do
              node --check "$edition/$script"
            done
          done
          node --test tests/*.cjs

      - name: Check package isolation and assemble extension ZIPs
        run: |
          set -euo pipefail
          node -e "const a=require('./iframe/manifest.json'), b=require('./hybrid/manifest.json'); if (a.permissions.includes('debugger') || !b.permissions.includes('debugger')) process.exit(1)"
          for edition in iframe hybrid; do
            (cd "$edition" && zip -q -r "$GITHUB_WORKSPACE/auto-type-1.0.2-${edition}.zip" LICENSE README.md background.js content.js main-bridge.js manifest.json popup.css popup.html popup.js icons/)
            test "$(unzip -p "auto-type-1.0.2-${edition}.zip" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version_name")" = "1.0.2"
          done

      - name: Remove requested sentence from existing beta Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.2-beta --json body --jq .body > "$RUNNER_TEMP/beta-notes.md"
          python3 - "$RUNNER_TEMP/beta-notes.md" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          unwanted = "**Pre-release:** This is a beta build. Mouse Lock is *not included*; it is being considered for v1.0.3. Stable v1.0.1 remains available separately."
          if unwanted in text:
              text = text.replace(unwanted + "\n\n", "")
              path.write_text(text)
          PY
          gh release edit v1.0.2-beta --notes-file "$RUNNER_TEMP/beta-notes.md"

      - name: Publish stable v1.0.2 Release with both packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD^)"
          cat > "$RUNNER_TEMP/stable-notes.md" <<'NOTES'
          ## What's new in v1.0.2

          - **Pause / resume shortcut:** Press `Alt + Shift + P` (Option + Shift + P on macOS) to toggle a typing task.
          - **Cancel shortcut:** Press `Alt + Shift + X` (Option + Shift + X on macOS) to stop a task without removing text already typed.
          - **Improved multi-tab shortcut routing:** Commands prioritize the originating Docs tab, then the currently focused Docs tab. If one background task is running it can also be controlled from another Chrome tab; ambiguous multi-task situations are ignored for safety.
          - **Service Worker reconnection:** Missing background receivers are retried up to 3 times with brief backoff. iframe mode then uses local pacing if needed, periodically probes the background connection, and restores worker-based pacing when it recovers.
          - **Draft and session reliability:** Preserve popup drafts, allow one-click **Clear draft**, protect against stale draft overwrites, and finish task cleanup even when a keyboard-lock cleanup step fails.
          - **Code review updates:** Corrected shortcut target precedence across Chrome windows and added targeted regression cases. Both editions use stable version metadata `1.0.2`.

          ## Downloads

          - `auto-type-1.0.2-iframe.zip` — recommended; no Chrome debugger permission.
          - `auto-type-1.0.2-hybrid.zip` — supports CDP fallback; requires Chrome debugger permission.

          Extract the ZIP. In `chrome://extensions`, turn on Developer mode, select **Load unpacked**, and choose the extracted folder containing `manifest.json`. Refresh already-open Google Docs tabs after installing. Shortcuts can be remapped at `chrome://extensions/shortcuts`.

          ## Known issue

          Google Docs uses an undocumented internal iframe input interface. Chrome or Google Docs changes can cause synthetic events to be ignored, and local timer fallback may be throttled in background tabs. Verify the final document contents after each run.
          NOTES
          if gh release view v1.0.2 >/dev/null 2>&1; then
            gh release upload v1.0.2 auto-type-1.0.2-iframe.zip auto-type-1.0.2-hybrid.zip --clobber
            gh release edit v1.0.2 --title "Auto Type v1.0.2" --notes-file "$RUNNER_TEMP/stable-notes.md" --prerelease=false --draft=false
          else
            gh release create v1.0.2 auto-type-1.0.2-iframe.zip auto-type-1.0.2-hybrid.zip --target "$SOURCE_SHA" --title "Auto Type v1.0.2" --notes-file "$RUNNER_TEMP/stable-notes.md"
          fi
