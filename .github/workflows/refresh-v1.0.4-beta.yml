name: Refresh Auto Type v1.0.4-beta ZIPs (one-time)
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-v1.0.4-beta.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm reviewed main commit and single workflow-only change
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD^)"
          test "$source_sha" = "b469e770968cacbf7a5f3a5aefc771c679385681"
          changes="$(git diff --name-only "$source_sha" HEAD)"
          test "$changes" = ".github/workflows/refresh-v1.0.4-beta.yml"
          echo "Publishing reviewed source: $source_sha"
      - name: Audit syntax, permissions, and run the full regression suite
        shell: bash
        run: |
          set -euo pipefail
          for edition in iframe hybrid; do
            node -e "const m=require('./$edition/manifest.json');if(m.version!=='1.0.4'||m.version_name!=='1.0.4-beta')process.exit(1)"
            for script in background.js content.js main-bridge.js config-codec.js popup.js; do
              node --check "$edition/$script"
            done
          done
          cmp iframe/content.js hybrid/content.js
          cmp iframe/popup.js hybrid/popup.js
          cmp iframe/config-codec.js hybrid/config-codec.js
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          for(const edition of ['iframe','hybrid']){
            const manifest=require('./'+edition+'/manifest.json');
            const permissions=[...manifest.permissions].sort();
            assert.deepEqual(permissions,edition==='iframe'?['scripting','storage']:['debugger','scripting','storage']);
            assert.match(fs.readFileSync(edition+'/popup.js','utf8'),/readyToStart/);
            const script=fs.readFileSync(edition+'/content.js','utf8');
            assert.match(script,/readyToStart: job.finalized/);
            assert.doesNotMatch(script,/sendToBackground\("AT_BG_BACKSPACE"/);
          }
          NODE
          timeout --signal=TERM 120s node --test tests/*.cjs
      - name: Build and inspect both independently installable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for edition in iframe hybrid; do
            (cd "$edition" && zip -q -r "../dist/auto-type-1.0.4-beta-${edition}.zip" \
              LICENSE README.md manifest.json background.js content.js \
              main-bridge.js config-codec.js popup.html popup.css popup.js icons/)
            file="dist/auto-type-1.0.4-beta-${edition}.zip"
            unzip -t "$file" | tail -1
            for required in manifest.json config-codec.js background.js content.js popup.js popup.html icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png; do
              unzip -Z1 "$file" | grep -Fxq "$required"
            done
            for source in manifest.json content.js background.js popup.html popup.css popup.js config-codec.js; do
              unzip -p "$file" "$source" | cmp - "$edition/$source"
            done
          done
          sha256sum dist/auto-type-1.0.4-beta-*.zip
      - name: Replace existing beta release assets, verify, then update tag and notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.4-beta"
          source_sha="$(git rev-parse HEAD^)"
          old_sha="1ff4cf06f2e6cc48a39805adf9d6b97b2588a21b"
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          if [[ "$current" != "$old_sha" && "$current" != "$source_sha" ]]; then
            echo "::error::Unexpected beta tag target: $current"
            exit 1
          fi
          gh release view "$tag" --json tagName,isPrerelease,isDraft \
            | jq -e '.tagName=="v1.0.4-beta" and .isPrerelease==true and .isDraft==false'
          gh release view "$tag" --json body --jq '.body' > /tmp/previous-beta-notes.md
          gh release upload "$tag" \
            dist/auto-type-1.0.4-beta-iframe.zip \
            dist/auto-type-1.0.4-beta-hybrid.zip --clobber
          mkdir -p dist/downloaded
          gh release download "$tag" --dir dist/downloaded --pattern 'auto-type-1.0.4-beta-*.zip'
          for edition in iframe hybrid; do
            file="auto-type-1.0.4-beta-${edition}.zip"
            cmp "dist/$file" "dist/downloaded/$file"
            unzip -t "dist/downloaded/$file" | tail -1
          done
          gh release view "$tag" --json assets | jq -e \
            '([.assets[].name] | sort) == (["auto-type-1.0.4-beta-iframe.zip","auto-type-1.0.4-beta-hybrid.zip"] | sort)'
          cat > /tmp/updated-beta-notes.md <<EOF
          ## Refreshed beta packages — 2026-11-26

          The iframe and Hybrid ZIPs were rebuilt and verified against source commit \`$source_sha\`.

          - **Fix:** Stop no longer enables Start until the previous typing task has finished cleanup, including pending waits and Chrome debugger detach.
          - **Safety:** CDP automatic typo correction no longer queues destructive Backspace keys that could reach a reloaded Google Docs iframe.
          - **Compatibility:** The popup detects an older loaded content script and asks you to reload the Google Docs tab.
          - **Included:** All earlier v1.0.4-beta Token/JSON configuration sharing, feedback registration, and UI fixes.
          - **Install:** Re-download and unpack the ZIP even if you previously installed v1.0.4-beta. Reload the unpacked extension in \`chrome://extensions\` and refresh open Google Docs tabs. Version names stay v1.0.4-beta; unpacked extensions do not auto-update.

          This is still a prerelease. Google Docs editor internals may change; inspect the document after typing.

          ---
          EOF
          cat /tmp/previous-beta-notes.md >> /tmp/updated-beta-notes.md
          # Move only this mutable beta tag, never stable tags.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
            -f sha="$source_sha" -F force=true > /dev/null
          gh release edit "$tag" --target "$source_sha" --notes-file /tmp/updated-beta-notes.md
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$source_sha"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '{tag_name, target_commitish, prerelease, draft, asset_count: (.assets|length)}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "v1.0.3"
          sha256sum dist/downloaded/auto-type-1.0.4-beta-*.zip
