name: Bootstrap Auto Type source

on:
  push:
    paths:
      - '.bootstrap/archive.part05'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Expand checked source archive
        run: |
          cat .bootstrap/archive.part* | base64 --decode > /tmp/auto-type-source.tar.xz
          tar -xJf /tmp/auto-type-source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Add Auto Type v1.0.0 source editions'
          git push origin HEAD:main
