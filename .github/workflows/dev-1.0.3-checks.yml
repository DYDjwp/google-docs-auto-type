name: Validate and release Auto Type

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both Chrome extension editions
        run: |
          set -euo pipefail
          node -e "const a=require('./iframe/manifest.json'),b=require('./hybrid/manifest.json');if(a.version!==b.version||a.version_name!==b.version_name||!/^\\d+\\.\\d+\\.\\d+(?:\\.\\d+)?$/.test(a.version))process.exit(1)"
          for edition in iframe hybrid; do
            for script in "$edition"/*.js; do node --check "$script"; done
          done
      - name: Run regression tests
        run: node --test tests/*.cjs

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package and publish stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./iframe/manifest.json').version")"
          label="$(node -p "require('./iframe/manifest.json').version_name")"
          if [[ "$version" != "1.0.4.1" || "$label" != "$version" ]]; then
            echo "Not the approved stable 1.0.4.1 release"; exit 0
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; not overwriting"; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/auto-type-release"
          for edition in iframe hybrid; do
            (cd "$edition" && zip -q -r "$RUNNER_TEMP/auto-type-release/auto-type-$version-$edition.zip" .)
            unzip -t "$RUNNER_TEMP/auto-type-release/auto-type-$version-$edition.zip"
          done
          gh release create "$tag" "$RUNNER_TEMP"/auto-type-release/*.zip --target "$GITHUB_SHA" --title "Auto Type v$version" --latest --notes "Stable 1.0.4.1 restores the original optional iframe Fix typo behavior without changing the 1.0.4 audited draft, status, and CDP session protections. Synthetic iframe dispatch cannot confirm editor acceptance; review the document or leave Fix typo off for important documents. CDP does not perform automatic Backspace. The experimental model-aware caret features remain on dev/1.0.5."
