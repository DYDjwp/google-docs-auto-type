name: Validate Auto Type (1.0.5 dev)

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check both Chrome extension editions
        run: |
          set -euo pipefail
          for edition in iframe hybrid; do
            node -e "const m=require('./${edition}/manifest.json');if(m.version !== '1.0.5' || m.version_name !== '1.0.5-dev')process.exit(1)"
            for script in annotated-early.js background.js content.js main-bridge.js config-codec.js popup.js; do
              node --check "$edition/$script"
            done
          done
      - name: Run regression tests
        run: node --test tests/*.cjs
