name: Diagnose Stop cleanup tests (temporary)
on:
  push:
    branches: [fix/stop-cleanup-readiness]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate cleanup regression
        run: |
          set -o pipefail
          timeout --signal=TERM 15s node --test tests/v1.0.4-stop-cleanup.cjs
          timeout --signal=TERM 15s node --test tests/v1.0.3-cdp-and-draft-alert.cjs
          timeout --signal=TERM 15s node --test tests/v1.0.4-config-token.cjs
      - name: Isolate every other test file with timeout
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.cjs; do
            echo "CASE: $file"
            timeout --signal=TERM 12s node --test "$file" > /tmp/test-case.log 2>&1 || {
              tail -100 /tmp/test-case.log
              echo "::error::Failed or timed out: $file"
              exit 1
            }
            tail -8 /tmp/test-case.log
          done

